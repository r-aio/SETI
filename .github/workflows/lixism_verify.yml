name: LIXISM SETI Deep Space Scanner

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 */12 * * *' 
  workflow_dispatch: 

jobs:
  deep_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360 

    steps:
    - name: Pobranie struktury rdzenia LIXISM
      uses: actions/checkout@v4

    - name: Inicjalizacja środowiska Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Zasilenie maszyny prawami fizyki
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Aktywacja Rdzenia L0-ISM
      id: skaner
      run: |
        python lixism_core.py

    - name: Przechwycenie Dowodu Fizycznego (Artefakt SAT)
      if: failure() 
      uses: actions/upload-artifact@v4
      with:
        name: DO_POBRANIA_Odkrycie_LIXISM_Sygnal
        path: LIXISM_SIGNAL_DETECTED.txt
        retention-days: 90 
