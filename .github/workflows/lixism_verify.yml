name: LIXISM SETI Deep Space Scanner

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 */12 * * *' # Odpalaj automatycznie skaner co 12 godzin
  workflow_dispatch: # Dodaje przycisk do ręcznego uruchamiania na żądanie

jobs:
  deep_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # Bezpieczny margines poniżej 6 godzin (360 min)

    steps:
    - name: Pobranie rdzenia LIXISM
      uses: actions/checkout@v3

    - name: Konfiguracja silnika Python (Deterministyczny weryfikator)
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalacja rdzenia analitycznego (Z3 + Blimpy)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Aktywacja skanera przestrzeni stanów (Continuous Mode)
      run: |
        python lixism_core.py
