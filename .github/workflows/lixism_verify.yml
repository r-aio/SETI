name: LIXISM SETI Data Physics Validator

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0' # Automatyczny audyt raz w tygodniu (zabezpieczenie stanu prior art)

jobs:
  build_and_verify:
    runs-on: ubuntu-latest

    steps:
    - name: Pobranie rdzenia LIXISM
      uses: actions/checkout@v3

    - name: Konfiguracja silnika Python (Deterministyczny weryfikator)
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalacja Z3 Solver i bibliotek astronomicznych
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Egzekucja LIXISM_CORE na surowym szumie kosmicznym (Z3 SAT/UNSAT)
      run: |
        python lixism_core.py
